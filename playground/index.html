<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SDUI Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,900&family=Geist:wght@400;600&family=Inter:wght@600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f4f5f7;
        --panel: #ffffff;
        --ink: #14161a;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #355ff2;
        --accent-soft: #eef2ff;
        --warn: #b45309;
        --warn-soft: #fff7ed;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 'DM Sans', system-ui, sans-serif; }
      #root { height: 100%; }
      .app { display: grid; grid-template-columns: 260px minmax(0, 1fr) 340px; height: 100vh; overflow: hidden; }
      .stage { min-width: 0; height: 100vh; overflow: auto; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .stage.chat { overflow: hidden; }
      .inspector { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; height: 100vh; }
      .inspectorHead { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
      .editInPg { display: block; width: 100%; margin: 4px 0 10px; border: 0; background: var(--accent); color: #fff; font: inherit; font-size: 13px; font-weight: 700; padding: 9px 12px; border-radius: 8px; cursor: pointer; text-align: center; }
      .editInPg:hover { background: #1e3fbf; }
      .editInPg:disabled { opacity: .7; cursor: default; }
      .crumb { color: var(--muted); font-size: 12px; }
      h1 { margin: 4px 0 8px; font-size: 18px; line-height: 1.25; }
      .links { display: flex; gap: 14px; }
      .links a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 12px; }
      .links a:hover { text-decoration: underline; }
      .settings { padding: 12px 20px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
      .setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .settingLabel { color: var(--muted); font-size: 12px; }
      .seg { display: inline-flex; background: var(--bg); border-radius: 8px; padding: 2px; }
      .seg button { font: inherit; font-size: 12px; border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); }
      .seg button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
      .tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); }
      .tabs button { font: inherit; border: 0; background: transparent; padding: 10px 8px; cursor: pointer; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
      .tabs button.on { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
      .badge { font-size: 10px; font-weight: 700; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 6px; }
      .badge.warn { background: var(--warn-soft); color: var(--warn); }
      .tabBody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .log { overflow: auto; padding: 12px 20px; }
      .log pre { margin: 0 0 8px; font: 11.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; background: var(--bg); border-radius: 6px; padding: 8px 10px; }
      .entry { margin-bottom: 10px; }
      .entryHead { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
      .jsonEditor { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      .jsonEditor textarea { flex: 1; border: 0; padding: 12px 20px; font: 11.5px/1.5 var(--mono); resize: none; outline: none; background: #fbfbfc; }
      .editorFoot { display: flex; justify-content: space-between; align-items: center; padding: 8px 20px; border-top: 1px solid var(--line); font-size: 12px; }
      .linkButton { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
      .error { color: #b91c1c; font: 12px var(--mono); }
      @media (max-width: 1100px) { .app { grid-template-columns: 220px minmax(0, 1fr) 300px; } }
      @media (max-width: 820px) { .app { grid-template-columns: 1fr; height: auto; overflow: visible; } .sidebar { height: 40vh; } .stage, .inspector { height: auto; } .stage.chat { overflow: visible; } .phone { height: 760px; } }
      .sidebar { background: var(--panel); border-right: 1px solid var(--line); height: 100vh; display: flex; flex-direction: column; min-height: 0; }
      .sidebarHead { padding: 16px 12px 8px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
      .sidebarList { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 32px; }
      .brand { font-weight: 700; font-size: 15px; padding: 0 8px 12px; }
      .search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
      .search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
      .section { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; color: var(--muted); padding: 16px 8px 4px; }
      .group { margin-bottom: 4px; }
      .top { margin-bottom: 2px; }
      .topTitle { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: transparent; font: inherit; font-weight: 700; color: var(--ink); padding: 7px 8px; border-radius: 6px; cursor: pointer; text-align: left; }
      .topTitle:hover { background: var(--bg); }
      .topTitle.current { color: var(--accent); }
      .chev { display: inline-block; width: 10px; color: var(--muted); transition: transform .15s ease-out; }
      .chev.open { transform: rotate(90deg); }
      .count { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--muted); }
      .topBody { padding: 0 0 6px 10px; }
      @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
      .groupTitle { font-weight: 600; font-size: 12px; color: var(--muted); padding: 6px 8px 2px; display: flex; align-items: center; gap: 6px; }
      .tag { font-size: 10px; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 1px 5px; }
      .item { display: block; padding: 5px 8px 5px 18px; border-radius: 6px; color: var(--ink); text-decoration: none; }
      .item:hover { background: var(--bg); }
      .item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
      .device { padding: 20px; border-radius: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); }
      .banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; max-width: 420px; }
      .empty { color: var(--muted); padding: 24px; }
      .kind { font-weight: 700; }
      .kind.action { color: var(--accent); }
      .kind.track { color: #0e8a36; }
      .muted { color: var(--muted); }
      .phone { display: flex; flex-direction: column; height: min(100%, 900px); flex-shrink: 0; border-radius: 36px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.10); }
      .statusbar { height: 50px; padding: 21px 16px 0; display: flex; justify-content: space-between; align-items: flex-start; background: #ffffff; }
      .clock { font: 600 17px/22px -apple-system, 'SF Pro', system-ui, sans-serif; width: 80px; text-align: center; }
      .levels { display: flex; gap: 7px; align-items: center; height: 22px; padding-right: 8px; }
      .chatHeader { display: flex; justify-content: space-between; padding: 2px 16px 0; }
      .round { width: 36px; height: 36px; border-radius: 35px; background: #fdfdfd; border: 1px solid #ffffff; box-shadow: 0 1px 4px rgba(0,0,0,.17); display: inline-flex; align-items: center; justify-content: center; }
      .round img { width: 24px; height: 24px; }
      .chatBody { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 24px; }
      .bubble { align-self: flex-end; max-width: 80%; margin-top: 12px; background: #f5f7fe; border: 1px solid #dae1fb; border-radius: 16px 0 16px 16px; padding: 11px 16px; font: 400 14px/20px 'DM Sans', sans-serif; color: #000; }
      .reply { display: flex; flex-direction: column; gap: 8px; }
      .myra { position: relative; height: 28px; width: 60px; }
      .myraText { position: absolute; top: 7px; left: 0; width: 260px; font: 800 16px/normal 'DM Sans', sans-serif; background: linear-gradient(103.5deg, #010916 2.2%, #3167d3 10%, #59baff 16.2%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .myraStar { position: absolute; left: 33px; top: 0; width: 24px; height: 24px; }
      .composer { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; background: #ffffff; }
      .composerCard { width: calc(100% - 20px); height: 88px; background: #fdfdfd; border: 2px solid #ffffff; border-radius: 20px 20px 0 0; box-shadow: 0 0 20px rgba(53,95,242,.18); padding: 12px 14px 0; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
      .placeholder { font: 400 16px/20px 'DM Sans', sans-serif; color: rgba(0,0,0,.3); }
      .caret { font-weight: 900; background: linear-gradient(152.7deg, #51afe6 1.7%, #355ff2 9.5%, #11287a 15.2%); -webkit-background-clip: text; background-clip: text; color: transparent; margin-right: 1px; }
      .composerRow { display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px; }
      .composerLeft { display: flex; gap: 8px; align-items: center; }
      .chip { height: 30px; box-sizing: border-box; background: #f2f2f2; border: 1px solid #d8d8d8; border-radius: 29px; display: inline-flex; align-items: center; gap: 4px; font: 400 14px/normal 'DM Sans', sans-serif; color: #757575; }
      .iconChip { width: 30px; justify-content: center; }
      .modeChip { padding: 0 10px 0 6px; }
      .chip img { width: 16px; height: 16px; }
      .speak { height: 30px; width: 78px; box-sizing: border-box; background: #fff; border: 1px solid #010916; border-radius: 32px; display: inline-flex; align-items: center; gap: 6px; padding-left: 9px; }
      .speak img { width: 14px; height: 14px; }
      .speakText { font: 900 14px/normal 'DM Sans', sans-serif; background: linear-gradient(154.3deg, #010916 45%, #3167d3 68.7%, #59baff 84.7%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .homeIndicator { height: 34px; width: 100%; position: relative; }
      .homeIndicator::after { content: ''; position: absolute; left: 50%; bottom: 8px; width: 144px; height: 5px; margin-left: -72px; border-radius: 100px; background: #000; }
      .bare .phone { border-radius: 0; box-shadow: none; }
      .bare { background: #ffffff; min-height: 100%; }
      .bare .device { box-shadow: none; border-radius: 0; }

      /* ---------- mode switch ---------- */
      .modeRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 2px 10px; }
      .modeRow .brand { padding: 0; font-weight: 800; letter-spacing: .02em; }
      .modeSwitch { display: inline-flex; background: var(--bg); border-radius: 8px; padding: 2px; }
      .modeSwitch a { font-size: 12px; padding: 4px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; }
      .modeSwitch a.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

      /* ---------- playground editor ---------- */
      .editor { display: grid; grid-template-columns: 272px minmax(0, 1fr) 320px; height: 100vh; overflow: hidden; }
      .edLeft, .edRight { background: var(--panel); display: flex; flex-direction: column; min-height: 0; height: 100vh; }
      .edLeft { border-right: 1px solid var(--line); }
      .edRight { border-left: 1px solid var(--line); }
      .edLeft .sidebarHead { padding: 16px 12px 8px; }
      .edTabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
      .edTabs button { font: inherit; border: 0; background: transparent; padding: 10px 8px; cursor: pointer; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
      .edTabs button.on { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
      .edTabs .count { font-size: 11px; color: var(--muted); font-weight: 500; }

      .layers { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 6px 12px; }
      .layer { display: flex; align-items: center; gap: 6px; height: 28px; padding-right: 6px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
      .layer:hover, .layer.hov { background: var(--bg); }
      .layer.sel { background: var(--accent-soft); }
      .layer.sel .ltype { color: var(--accent); }
      .twisty { width: 14px; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0; font-size: 10px; }
      .twisty.none { cursor: default; }
      .glyph { width: 18px; text-align: center; color: var(--muted); font-size: 12px; flex-shrink: 0; }
      .glyph.big { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }
      .ltype { font-weight: 600; font-size: 12px; }
      .llabel { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
      .lactions { margin-left: auto; display: none; gap: 2px; }
      .layer:hover .lactions, .tpl:hover .lactions { display: inline-flex; }
      .lactions button { border: 0; background: transparent; width: 22px; height: 22px; border-radius: 5px; cursor: pointer; color: var(--muted); font-size: 12px; }
      .lactions button:hover { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
      .layersHint { margin: 12px 8px 0; padding-top: 10px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 11px; line-height: 1.8; }
      kbd { font: 11px var(--mono); background: var(--bg); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

      .templates { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 10px 16px; display: flex; flex-direction: column; gap: 4px; }
      .tplHead { display: flex; gap: 6px; margin-bottom: 6px; }
      .tplHead .search { flex: 1; }
      .tpl { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; }
      .tpl:hover { background: var(--bg); }
      .tpl.on { background: var(--accent-soft); }
      .tplThumb { width: 36px; height: 36px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--muted); flex-shrink: 0; }
      .tplMeta { min-width: 0; flex: 1; }
      .tplName { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tplSub { color: var(--muted); font-size: 11px; }

      .edCenter { position: relative; display: flex; flex-direction: column; min-width: 0; height: 100vh; }
      .edToolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .edTitle { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .nameInput { font: inherit; font-size: 15px; font-weight: 700; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; min-width: 120px; max-width: 260px; background: transparent; }
      .nameInput:hover { border-color: var(--line); }
      .nameInput:focus { outline: none; border-color: var(--accent); background: var(--panel); }
      .saveState { font-size: 11px; color: #0e8a36; }
      .saveState.pending { color: var(--muted); }
      .edTools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .iconGroup { display: inline-flex; gap: 2px; }
      .iconBtn { border: 1px solid var(--line); background: var(--panel); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 15px; color: var(--ink); }
      .iconBtn:disabled { color: #c4c7cc; cursor: default; }
      .chip { border: 0; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 600; padding: 5px 10px; cursor: pointer; }
      .chip.ok { background: #e7f8ec; color: #0e8a36; }
      .chip.warn { background: var(--warn-soft); color: var(--warn); }
      .ghostBtn { border: 1px solid var(--line); background: var(--panel); font: inherit; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
      .primaryBtn { border: 0; background: var(--accent); color: #fff; font: inherit; font-size: 12px; font-weight: 700; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
      .primaryBtn.small { padding: 6px 10px; white-space: nowrap; }
      .seg.small button { padding: 3px 8px; }

      .edStage { position: relative; flex: 1; min-height: 0; overflow: auto; padding: 24px; display: flex; flex-direction: column; align-items: center;
        background-color: var(--bg); background-image: radial-gradient(#dfe2e7 1px, transparent 1px); background-size: 16px 16px; }
      .edStage .phone { flex: 1 0 auto; height: auto; min-height: 560px; max-height: 900px; }
      .edStage.fit .phone { flex: 1 1 0; min-height: 0; }
      .edStage.selecting * { cursor: default; }
      .hoverBox, .selBox { position: absolute; pointer-events: none; border-radius: 3px; }
      .hoverBox { outline: 1px dashed var(--accent); outline-offset: 1px; }
      .selBox { outline: 2px solid var(--accent); outline-offset: 1px; }
      .selTag { position: absolute; top: -20px; left: -2px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px 4px 4px 0; white-space: nowrap; }
      .toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); background: #14161a; color: #fff; font-size: 12px; padding: 8px 12px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }

      .paletteWrap { position: relative; }
      .scrim { position: fixed; inset: 0; z-index: 20; }
      .scrim.dark { background: rgba(15,18,24,.35); }
      .palette { position: absolute; right: 0; top: calc(100% + 8px); z-index: 21; width: 380px; max-height: 70vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.16); padding: 10px; }
      .palette .search { margin-bottom: 8px; }
      .palFamily { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 8px 4px 4px; }
      .palGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
      .palItem { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 8px; font: inherit; font-size: 12px; cursor: pointer; text-align: left; }
      .palItem:hover { border-color: var(--accent); background: var(--accent-soft); }
      .palGlyph { width: 16px; text-align: center; color: var(--accent); }

      .inspector { display: flex; flex-direction: column; min-height: 0; flex: 1; }
      .insHead { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
      .crumbs { font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; }
      .crumb { border: 0; background: none; font: inherit; color: var(--muted); cursor: pointer; padding: 1px 2px; border-radius: 4px; }
      .crumb:hover { color: var(--accent); background: var(--accent-soft); }
      .crumb.on { color: var(--ink); font-weight: 600; }
      .crumbSep { margin: 0 2px; }
      .insTitle { display: flex; gap: 10px; align-items: center; }
      .insType { font-weight: 700; font-size: 15px; }
      .insLabel { color: var(--muted); font-size: 12px; }
      .insActions { display: flex; flex-wrap: wrap; gap: 4px; }
      .insActions button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; font: inherit; font-size: 11px; padding: 3px 7px; cursor: pointer; }
      .insActions button:hover { border-color: var(--accent); color: var(--accent); }
      .insActions .danger:hover { border-color: #dc2626; color: #dc2626; }
      .insBody { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0 24px; }
      .insSection { border-bottom: 1px solid var(--line); padding: 4px 16px 10px; }
      .insSection summary { cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 0; list-style: none; }
      .insSection summary::before { content: '▾ '; }
      .insSection:not([open]) summary::before { content: '▸ '; }
      .field { display: grid; grid-template-columns: 96px minmax(0, 1fr) 18px; align-items: center; gap: 8px; padding: 4px 0; }
      .field.stacked { grid-template-columns: minmax(0, 1fr) 18px; }
      .field.stacked .fieldLabel { grid-column: 1 / -1; }
      .fieldLabel { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .fieldCtl { min-width: 0; }
      .fieldCtl select, .txt, .num { width: 100%; font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; background: var(--panel); }
      .fieldCtl select:focus, .txt:focus, .num:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      textarea.txt { resize: vertical; }
      .fieldClear { border: 0; background: none; color: #c4c7cc; cursor: pointer; font-size: 14px; padding: 0; }
      .fieldClear:hover { color: #dc2626; }
      .tokenCtl { display: flex; align-items: center; gap: 6px; }
      .tokenCtl select { flex: 1; min-width: 0; }
      .swatch { width: 16px; height: 16px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); flex-shrink: 0; }
      .scale { font-size: 10px; color: var(--muted); font-family: var(--mono); }
      .switch { position: relative; display: inline-block; width: 32px; height: 18px; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .switch span { position: absolute; inset: 0; background: #d1d5db; border-radius: 999px; transition: background .15s; cursor: pointer; }
      .switch span::after { content: ''; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
